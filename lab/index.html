<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ラボ片付け">
<title>ラボ片付け</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<header class="bar">
  <button id="btn-edit" class="pill">編集</button>
  <h1>ラボ片付け</h1>
  <button id="btn-add" class="pill round" aria-label="追加"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</header>

<main>
  <section id="summary" class="summary"></section>
  <div id="list"></div>
  <div id="edit-tools" class="edit-tools" hidden>
    <button id="btn-clear-done" class="text-btn danger">完了した依頼を消去</button>
  </div>
</main>

<!-- 追加・編集シート -->
<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-head">
      <button id="sh-cancel" class="pill">キャンセル</button>
      <h2 id="sh-title">新規</h2>
      <button id="sh-save" class="pill accent">保存</button>
    </div>
    <div class="seg" id="sh-kind">
      <button data-kind="clean">後片付け</button>
      <button data-kind="request">依頼事項</button>
    </div>
    <div class="group">
      <input id="sh-name" class="field big" placeholder="タスク名（例: ピペット洗浄）" maxlength="60" autocomplete="off">
    </div>
    <div class="group" id="g-days">
      <div class="label">繰り返し<span class="sub" id="days-note">未選択は毎日</span></div>
      <div class="days" id="sh-days"></div>
    </div>
    <div class="group" id="g-req">
      <div class="row"><span class="label">依頼者</span><input id="sh-from" class="field inline" placeholder="例: 田中先生" maxlength="30"></div>
      <div class="row"><span class="label">期限</span><input id="sh-due" type="date" class="field inline"></div>
    </div>
    <div class="group">
      <input id="sh-note" class="field" placeholder="メモ（場所・手順など）" maxlength="120">
    </div>
    <button id="sh-delete" class="text-btn danger block" hidden>削除</button>
  </div>
</div>

<div id="install" class="install" hidden>
  <div class="msg"></div>
  <button class="go pill accent" hidden>インストール</button>
  <button class="x" aria-label="閉じる"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>

<script src="js/app.js?v=2"></script>
</body>
</html>
